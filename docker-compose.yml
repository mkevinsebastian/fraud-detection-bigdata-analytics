# Docker Compose untuk Fraud Detection System (On-Premise)
# Big Data Analytics - Assignment I

version: '3.8'

networks:
  fraud-detection-net:
    driver: bridge

volumes:
  postgres_data:
  cassandra_data:
  minio_data:
  redis_data:
  kafka_data:
  zookeeper_data:

services:
  # ==========================================
  # FRONTEND / REVERSE PROXY
  # ==========================================
  nginx:
    image: nginx:latest
    container_name: fraud-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - fraud-detection-net
    depends_on:
      - api-server

  # ==========================================
  # API SERVER
  # ==========================================
  api-server:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKERS=kafka1:9092,kafka2:9093,kafka3:9094
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fraud_detection
      - POSTGRES_USER=fraud_user
      - POSTGRES_PASSWORD=fraud_password
      - CASSANDRA_HOST=cassandra
      - REDIS_HOST=redis
    networks:
      - fraud-detection-net
    depends_on:
      - kafka1
      - postgres
      - cassandra
      - redis

  # ==========================================
  # MESSAGE STREAMING - KAFKA
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fraud-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - fraud-detection-net

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - fraud-detection-net
    depends_on:
      - zookeeper

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud-kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    networks:
      - fraud-detection-net
    depends_on:
      - zookeeper

  kafka3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud-kafka-3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    networks:
      - fraud-detection-net
    depends_on:
      - zookeeper

  # ==========================================
  # STREAM PROCESSING - FLINK
  # ==========================================
  flink-jobmanager:
    image: flink:1.18-scala_2.12
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    networks:
      - fraud-detection-net

  flink-taskmanager:
    image: flink:1.18-scala_2.12
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    networks:
      - fraud-detection-net
    depends_on:
      - flink-jobmanager

  # ==========================================
  # BATCH PROCESSING - SPARK
  # ==========================================
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    ports:
      - "7077:7077"
      - "8082:8080"
    environment:
      - SPARK_MODE=master
    networks:
      - fraud-detection-net

  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    networks:
      - fraud-detection-net
    depends_on:
      - spark-master

  # ==========================================
  # ORCHESTRATION - AIRFLOW
  # ==========================================
  airflow:
    image: apache/airflow:2.7.0
    container_name: fraud-airflow
    ports:
      - "8083:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql://airflow:airflow@postgres/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    networks:
      - fraud-detection-net
    depends_on:
      - postgres

  # ==========================================
  # DATABASES
  # ==========================================
  postgres:
    image: postgres:15
    container_name: fraud-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fraud-detection-net

  cassandra:
    image: cassandra:4.1
    container_name: fraud-cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - fraud-detection-net

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - fraud-detection-net

  # ==========================================
  # DATA LAKE - MINIO
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: fraud-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - fraud-detection-net

  # ==========================================
  # MONITORING
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - fraud-detection-net

  grafana:
    image: grafana/grafana:latest
    container_name: fraud-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - fraud-detection-net
    depends_on:
      - prometheus
